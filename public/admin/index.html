<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Content Manager — J. James Designs</title>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

  <script>
    // Sveltia wipes document.body's contents entirely on mount (not just
    // innerHTML — it removes any sibling elements too), so anything placed
    // in the page normally gets destroyed once it loads. Fighting that with
    // timing tricks is fragile, so instead this just keeps re-inserting the
    // toolbar on an interval — cheap, and it self-heals no matter when or
    // how many times Sveltia re-renders.
    (function () {
      function ensureToolbar() {
        if (document.getElementById('cache-toolbar')) return;

        var toolbar = document.createElement('div');
        toolbar.id = 'cache-toolbar';
        toolbar.style.cssText = [
          'position: fixed', 'top: 12px', 'right: 12px', 'z-index: 2147483647',
          "font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
        ].join(';');

        var btn = document.createElement('button');
        btn.id = 'cache-clear-btn';
        btn.innerHTML = '<span aria-hidden="true">&#x21bb;</span> Clear Cache &amp; View Live Site';
        btn.style.cssText = [
          'display: flex', 'align-items: center', 'gap: 6px',
          'background: #1f2937', 'color: #fff', 'border: 1px solid rgba(255,255,255,0.15)',
          'border-radius: 8px', 'padding: 8px 14px', 'font-size: 13px', 'font-weight: 600',
          'cursor: pointer', 'box-shadow: 0 2px 8px rgba(0,0,0,0.25)',
        ].join(';');

        var toast = document.createElement('div');
        toast.textContent = 'Opened a fresh copy in a new tab';
        toast.style.cssText = [
          'display: none', 'margin-top: 6px', 'background: #1f2937', 'color: #a7f3d0',
          'border-radius: 6px', 'padding: 6px 10px', 'font-size: 12px', 'text-align: center',
        ].join(';');

        btn.addEventListener('click', async function () {
          try {
            if (window.caches && caches.keys) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }
          } catch (_) { /* non-fatal */ }

          var url = new URL(window.location.origin + '/');
          url.searchParams.set('_cb', Date.now());
          window.open(url.toString(), '_blank');

          toast.style.display = 'block';
          setTimeout(function () { toast.style.display = 'none'; }, 2500);
        });

        toolbar.appendChild(btn);
        toolbar.appendChild(toast);
        document.body.appendChild(toolbar);
      }

      ensureToolbar();
      setInterval(ensureToolbar, 400);
    })();
  </script>
</body>
</html>
