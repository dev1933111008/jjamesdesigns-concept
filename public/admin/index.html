<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Content Manager — J. James Designs</title>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

  <script>
    // Sveltia replaces document.body's contents on mount, so anything placed
    // inside <body> gets wiped. Attaching this toolbar to <html> instead
    // (as a sibling of <body>, not a child of it) means it survives that —
    // and since it's fixed-position, it stays visible over every screen
    // inside the CMS regardless of where Sveltia's own SPA routing takes you.
    (function () {
      var toolbar = document.createElement('div');
      toolbar.id = 'cache-toolbar';
      toolbar.style.cssText = [
        'position: fixed', 'top: 12px', 'right: 12px', 'z-index: 2147483647',
        "font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
      ].join(';');

      var btn = document.createElement('button');
      btn.id = 'cache-clear-btn';
      btn.innerHTML = '<span aria-hidden="true">&#x21bb;</span> Clear Cache &amp; View Live Site';
      btn.style.cssText = [
        'display: flex', 'align-items: center', 'gap: 6px',
        'background: #1f2937', 'color: #fff', 'border: 1px solid rgba(255,255,255,0.15)',
        'border-radius: 8px', 'padding: 8px 14px', 'font-size: 13px', 'font-weight: 600',
        'cursor: pointer', 'box-shadow: 0 2px 8px rgba(0,0,0,0.25)',
      ].join(';');

      var toast = document.createElement('div');
      toast.textContent = 'Opened a fresh copy in a new tab';
      toast.style.cssText = [
        'display: none', 'margin-top: 6px', 'background: #1f2937', 'color: #a7f3d0',
        'border-radius: 6px', 'padding: 6px 10px', 'font-size: 12px', 'text-align: center',
      ].join(';');

      btn.addEventListener('click', async function () {
        // Clear any Cache Storage API entries for this origin (a no-op if
        // the site doesn't use a service worker, which it currently doesn't
        // — safe either way, and covers it if that ever changes).
        try {
          if (window.caches && caches.keys) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (_) { /* non-fatal */ }

        // Open the live site with a cache-busting param so this load can't
        // be served from the browser's normal HTTP cache.
        var url = new URL(window.location.origin + '/');
        url.searchParams.set('_cb', Date.now());
        window.open(url.toString(), '_blank');

        toast.style.display = 'block';
        setTimeout(function () { toast.style.display = 'none'; }, 2500);
      });

      toolbar.appendChild(btn);
      toolbar.appendChild(toast);
      document.documentElement.appendChild(toolbar);
    })();
  </script>
</body>
</html>
