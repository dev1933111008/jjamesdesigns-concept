<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Content Manager — J. James Designs</title>
</head>
<body>
  <!-- Floating toolbar, injected outside Sveltia's own mounted UI so it
       survives every screen inside the CMS (it's a single-page app — there's
       no real page navigation for this to get wiped by). -->
  <div id="cache-toolbar" style="
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 999999;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  ">
    <button id="cache-clear-btn" style="
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1f2937;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    ">
      <span aria-hidden="true">&#x21bb;</span> Clear Cache &amp; View Live Site
    </button>
    <div id="cache-clear-toast" style="
      display: none;
      margin-top: 6px;
      background: #1f2937;
      color: #a7f3d0;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      text-align: center;
    ">Opened a fresh copy in a new tab</div>
  </div>

  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

  <script>
    (function () {
      var btn = document.getElementById('cache-clear-btn');
      var toast = document.getElementById('cache-clear-toast');

      btn.addEventListener('click', async function () {
        // Clear any Cache Storage API entries for this origin (a no-op if
        // the site doesn't use a service worker, which it currently doesn't
        // — safe either way, and covers it if that ever changes).
        try {
          if (window.caches && caches.keys) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (_) { /* non-fatal */ }

        // Open the live site with a cache-busting param so this load can't
        // be served from the browser's normal HTTP cache, regardless of
        // what page you navigate to from there.
        var url = new URL(window.location.origin + '/');
        url.searchParams.set('_cb', Date.now());
        window.open(url.toString(), '_blank');

        toast.style.display = 'block';
        setTimeout(function () { toast.style.display = 'none'; }, 2500);
      });
    })();
  </script>
</body>
</html>
