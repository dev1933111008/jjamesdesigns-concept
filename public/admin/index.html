<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Content Manager — J. James Designs</title>
</head>
<body>
  <!-- Sveltia clears out document.documentElement's children (not just
       document.body's) once it mounts, wiping any toolbar placed directly
       in this page. An iframe is a separate document entirely, so it
       survives regardless of how Sveltia manages its own DOM. -->
  <iframe
    src="/admin/toolbar.html"
    title="Cache tools"
    style="
      position: fixed;
      top: 0;
      right: 0;
      z-index: 2147483647;
      width: 320px;
      height: 90px;
      border: 0;
      background: transparent;
    "
  ></iframe>

  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
