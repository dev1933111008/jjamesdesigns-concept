<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #wrap { display: inline-block; padding: 12px; }
  button {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #1f2937;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  button:hover { background: #2d3748; }
  #toast {
    display: none;
    margin-top: 6px;
    background: #1f2937;
    color: #a7f3d0;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>
  <div id="wrap">
    <button id="btn"><span aria-hidden="true">&#x21bb;</span> Clear Cache &amp; View Live Site</button>
    <div id="toast">Opened a fresh copy in a new tab</div>
  </div>
  <script>
    document.getElementById('btn').addEventListener('click', async function () {
      // Same-origin parent site — clears any Cache Storage API entries
      // (a no-op today since the site has no service worker, but harmless
      // and covers it if that ever changes).
      try {
        if (window.top.caches && window.top.caches.keys) {
          var keys = await window.top.caches.keys();
          await Promise.all(keys.map(function (k) { return window.top.caches.delete(k); }));
        }
      } catch (_) { /* non-fatal */ }

      var url = new URL(window.location.origin + '/');
      url.searchParams.set('_cb', Date.now());
      window.top.open(url.toString(), '_blank');

      var toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(function () { toast.style.display = 'none'; }, 2500);
    });
  </script>
</body>
</html>
